appId: com.skymistery.trainingrecordingsystem
productName: Training Recording System
copyright: Copyright © 2026 Carmine (704798)
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: TrainingRecordingSystem-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
publish:
  provider: github
  owner: SkyMistery
  repo: TrainingRecordingSystem
  releaseType: draft
extraResources:
  - from: resources/whisper
    to: whisper
# Hardening: the installed app can't be run as a plain Node.js runtime or
# debugged from the command line, and loads only its own, unaltered app.asar.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
