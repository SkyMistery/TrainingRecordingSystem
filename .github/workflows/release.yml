name: Release

# Push a tag like v0.1.0 (matching package.json "version") to build the
# Windows installer and publish it, with the auto-update metadata, to a
# GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Create the release up front as a draft: when electron-builder creates it
      # itself, its parallel uploads can race and produce duplicate releases.
      - name: Create draft release
        shell: bash
        run: gh release create "$TAG" --draft --title "${TAG#v}" --generate-notes
      - run: npm run release
      - name: Publish release
        shell: bash
        run: gh release edit "$TAG" --draft=false --latest
